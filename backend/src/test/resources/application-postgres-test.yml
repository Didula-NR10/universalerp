spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  flyway:
    enabled: true
    url: ${TEST_DB_URL}
    user: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
erp:
  auth:
    secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    issuer: universal-erp-test
    audience: erp-test
  cors:
    allowed-origin: http://localhost:5173
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
